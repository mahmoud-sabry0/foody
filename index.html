<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Foody - browse meals by name, category, area and ingredient." />
    <title>Foody</title>
    <link rel="icon" href="./download.jpg" type="image/jpeg" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.2/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Side navigation -->
    <nav class="side-nav" id="sideNav" aria-label="Main navigation">
      <div class="nav-tab">
        <ul class="nav-links list-unstyled">
          <li><button type="button" data-page="search">Search</button></li>
          <li><button type="button" data-page="categories">Categories</button></li>
          <li><button type="button" data-page="areas">Area</button></li>
          <li><button type="button" data-page="ingredients">Ingredients</button></li>
          <li><button type="button" data-page="contact">Contact Us</button></li>
        </ul>
        <div class="nav-footer">
          <div class="social">
            <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
            <a href="#" aria-label="Twitter"><i class="bi bi-twitter"></i></a>
            <a href="#" aria-label="Website"><i class="bi bi-globe"></i></a>
          </div>
          <p class="copyright">Copyright &copy; <span id="year"></span> All Rights<br />Reserved.</p>
        </div>
      </div>

      <div class="nav-header">
        <button type="button" class="logo-btn" data-page="home" aria-label="Home">
          <img class="logo" src="./download.jpg" alt="Foody logo" />
        </button>
        <button type="button" class="toggle-btn" id="navToggle" aria-label="Open menu" aria-expanded="false">
          <i class="bi bi-list"></i>
        </button>
        <div class="header-icons">
          <i class="bi bi-globe"></i>
          <i class="bi bi-share-fill"></i>
        </div>
      </div>
    </nav>

    <main class="content">
      <!-- Search inputs -->
      <div class="container" id="searchContainer" hidden>
        <div class="row g-3 py-4">
          <div class="col-12 col-md-6">
            <input
              class="form-control bg-transparent text-white"
              type="search"
              placeholder="Search By Name"
              id="searchByName"
              autocomplete="off"
            />
          </div>
          <div class="col-12 col-md-6">
            <input
              class="form-control bg-transparent text-white"
              type="search"
              placeholder="Search By First Letter"
              id="searchByLetter"
              maxlength="1"
              autocomplete="off"
            />
          </div>
        </div>
      </div>

      <div class="container py-4">
        <div class="row g-4" id="rowData"></div>
      </div>
    </main>

    <div class="loading-screen" id="loader" hidden>
      <span class="loader"></span>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
